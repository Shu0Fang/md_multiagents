  description: >-
    综合各专科医生的诊断意见，给出最终的诊断结论。
  expected_output: >-
    一段综合性的诊断结论。
  agent: ad_specialist_agent
  context: [primary_care_task, neurologist_task, geriatrician_task, psychiatrist_task, psychologist_task]
