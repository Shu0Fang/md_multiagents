synthesis_task:
  description: >-
    请汇总以下五个专科任务的结构化输出，生成最终综合诊断结论。
    患者病历原文：{patient_record}
    请先使用已挂载的 RAG Tool 再次检索相关指南条目（top 5）做核对。
    严格基于检索条目与上游任务作答，不得引用未检索内容。

    【执行原则】
    - 先做 patient_record 原文锚点核对，再参考上游任务。
    - 若 patient_record 与上游摘要冲突，以 patient_record 为准，并在 disagreement_points 说明。
    - 区分“病史信息不足”与“检查信息不足”：病史不足可判 insufficient；仅检查不足不得直接判 insufficient。
    - 不得机械按多数投票，最终 risk_level 必须由 final_judgment 可解释。

    【优先级规则表（从高到低依次判断）】
    P0 insufficient（信息不足/病历矛盾）：
    - 病史本身严重不足（仅笼统主诉，缺少起病时间、进展、认知域、功能、伴随症状等），输出 `insufficient`。
    - 同一病历出现明显互相矛盾的功能描述（如严重功能下降 vs 复杂功能完全保留），且缺少客观量表或可靠知情者澄清，输出 `insufficient`。
    - 仅检查不足（缺 MMSE/MoCA、MRI、化验、ADL/IADL、NPI）不得直接判 `insufficient`。

    P1 high（红旗/高危模式）：
    - 命中红旗信号：快速进展、明显功能下降、定向障碍/迷路、走失风险、明确神经体征、脑血管事件、偏瘫、步态异常、肌阵挛、癫痫、意识障碍。
    - DLB 高风险组合：波动性认知 + 反复视幻觉 + 帕金森样表现/跌倒/REM 睡眠行为障碍。
    - NPH 三联征：步态障碍 + 尿急/尿失禁 + 认知下降。
    - 早发且强家族史并伴功能受损，或多专科一致高风险且与原文一致，也可判 `high`。

    P2 medium（MCI/前驱期或持续性下降）：
    - 量表边界异常或轻度异常（MoCA/MMSE）。
    - 持续认知下降、家属明确持续/反复观察，且功能基本保留（或仅轻度复杂功能影响）。
    - 可逆因素可能存在但不足以充分解释认知下降。
    - 明显抑郁/睡眠/食欲下降/重大心理应激/社交退缩并伴持续认知主诉或家属观察，判 `medium`。
    - 强锚点规则（必须执行）：若出现 `MoCA/MMSE 边界异常（如 MoCA 25）` + `持续约1年或更久记忆下降` + `家属观察到反复忘事/忘放东西`，必须判 `medium`，即使功能基本保留。
    - “自述 MoCA 25”视为待复核但有意义线索，必须计入判断，不得当作“无客观量表信息”。

    P3 low（低风险/可逆解释充分）：
    - 仅偶发轻微健忘或找词困难，功能保留，可用补偿策略，无持续加重、无红旗、无明确客观异常。
    - 明确可逆躯体因素（甲减样、B12 缺乏线索、明确药物影响）或药物/感官干扰可解释认知表现，且无红旗，可判 `low`。

    【一致性与冲突消解】
    - 若文本已承认量表边界异常 + 持续认知下降 + 家属持续观察（关键中风险锚点），不得输出 `low`。
    - 若规则同时命中多个等级，按优先级 P0 > P1 > P2 > P3。
    - 不得机械采纳多数专科结论；若多数为 low 但命中关键中风险锚点，仍须输出 medium 并在 disagreement_points 解释原因。
    - `risk_level` 仅允许：high, medium, low, insufficient。

    输出字段必须且仅包含：
    - final_judgment
    - risk_level
    - recommended_tests
    - disagreement_points
    - next_steps
    - safety_notes
    - evidence_chunks

    若证据缺失可输出 [] 或 "unknown"。
    最终输出必须是单个 JSON object，不要输出 markdown 代码块，不要输出额外段落。
  expected_output: >-
    单个 JSON object，且仅包含字段：final_judgment, risk_level,
    recommended_tests, disagreement_points, next_steps, safety_notes,
    evidence_chunks。
    `risk_level` 必须严格为 high/medium/low/insufficient 之一。
    若存在 `MoCA 25`（含“自述”）+ 持续约 1 年记忆下降 + 家属持续观察到反复忘事等锚点，risk_level 必须为 `medium`。
    对“自述 MoCA 25”必须在 final_judgment 中写明“待复核但有意义”，不得当作“无客观量表信息”。
    必须先基于 patient_record 原文完成锚点核对；若原文出现 `MoCA 25`、`持续约1年`、`家属观察反复忘事/忘放东西`，则不得输出 low。
    不得机械按多数专科投票定级；若多数为 low 但存在关键中风险锚点，必须输出 medium，并在 disagreement_points 解释原因。
    若同一病历存在互相矛盾的功能描述，且缺少客观量表或可靠知情者澄清，应输出 insufficient，不得强行输出 low/medium/high。
    若出现波动性认知、反复视幻觉、帕金森样表现、跌倒或 REM 睡眠行为障碍等组合，应输出 high；若出现步态障碍、尿急/尿失禁、认知下降三联征，应输出 high。
    若 final_judgment 中出现“MoCA 25”“边界异常”“持续约1年记忆下降”“家属观察到反复忘事/忘放东西”等锚点表述，risk_level 不得为 low。
    请遵守优先级约束（见 description），并在 `next_steps` 中对可逆因素给出优先排查建议（若适用）。
    不得输出 markdown 代码块，不得输出额外字段。
