synthesis_task:
  description: >-
    请汇总以下五个专科任务的结构化输出，生成最终综合诊断结论：
    请先使用已挂载的 RAG Tool 再次检索相关指南条目（top 5）做核对。
    严格基于检索条目与上游任务作答，不得引用未检索内容。
    - final_judgment: 综合判断 AD 疑似程度
    - risk_level: 风险等级（低/中/高）
    - recommended_tests: 推荐检查路径
    - disagreement_points: 各专科意见差异
    - next_steps: 下一步建议
    - safety_notes: 安全提示
    - evidence_chunks: 最终结论引用到的 chunk 文件名列表（需汇总上游证据）
    上游任务 context：
    - primary_care_task
    - neurologist_task
    - geriatrician_task
    - psychiatrist_task
    - psychologist_task
    若某字段在检索结果与上游任务中都没有证据，请输出空列表 [] 或 "unknown"。
    请严格按上述字段输出 JSON，不输出额外段落。
  expected_output: >-
    结构化字段结果，包含：
    final_judgment, risk_level, recommended_tests,
    disagreement_points, next_steps, safety_notes, evidence_chunks
  agent: ad_specialist_agent
  async_execution: false
  context:
    - primary_care_task
    - neurologist_task
    - geriatrician_task
    - psychiatrist_task
    - psychologist_task
