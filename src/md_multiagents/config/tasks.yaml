    不得仅因为“记忆 + 找词困难”就判定为多个认知域明确受损；只有当这些问题持续、反复、逐渐加重，或有 MoCA/MMSE 等客观证据支持时，才可输出 `medium`。
    输出字段：
    - psychiatric_findings: 精神科发现与体征
    - additional_tests: 需补充检查
    - referral_suggestions: 转诊建议
    - risk_level: AD 风险等级（low/medium/high）
    - evidence_chunks: 引用到的指南 chunk 文件名列表（如 chunk_012.txt）
    若某字段在检索结果中没有证据，请输出空列表 [] 或 "unknown"。
    必须输出单个 JSON object，禁止 markdown 代码块，禁止列表前缀符号（如 -、*、1.）。
  expected_output: >-
    结构化字段结果，包含：psychiatric_findings, additional_tests,
    referral_suggestions, risk_level, evidence_chunks。
    规则要点：
    - 仅当病史或 `extraction_task` 明确存在“躯体可逆因素”线索且无红旗时，方可判 `low`；
    - 若存在明显抑郁、睡眠障碍、食欲下降、重大心理应激、社交退缩等情绪/睡眠因素，并伴随持续认知主诉或家属明确持续观察，则应判 `medium`，而不是 `low`；
