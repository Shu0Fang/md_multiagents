    - 若病史或 `extraction_task` 明确出现“躯体可逆因素”线索且无红旗，则 `risk_level` 可为 `low`；
    - 若存在明显抑郁、睡眠障碍、食欲下降、重大心理应激、社交退缩等情绪/睡眠因素，并伴随持续认知主诉或家属明确持续观察，则应判 `medium`，而不是 `low`；
    - 若仅有偶发轻微健忘、偶发找词困难或主观记忆变慢，且功能完全保留、无客观异常和无持续加重证据，则应判 `low`；
    - 若存在持续 1 年或以上记忆下降且有客观量表边界异常或家属明确持续观察，应优先判为 `medium`（MCI/前驱期）；
