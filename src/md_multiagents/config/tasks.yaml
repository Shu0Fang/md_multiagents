    - 若仅有偶发轻微健忘、偶发找词困难或主观记忆变慢，且功能完全保留、无客观异常和无持续加重证据，则应判 `low`；
    - 若存在明确“躯体可逆因素”线索且无红旗，方可判 low；
    - 持续 1 年以上、家属确认且量表边界异常者，应优先判为 medium。
