extraction_task:
  description: >-
    请阅读以下患者的纵向病历，提取与阿尔茨海默病相关信息，并按固定字段输出。
    患者病历：{patient_record}
    输出字段要求：
    - core_symptoms: 核心症状列表
    - onset_time: 起病时间与病程阶段
    - progression_speed: 进展速度（缓慢/中等/快速）及依据
    - cognitive_domains: 受损认知域（记忆/执行/语言/视空间/定向力等）
    - behavioral_psychological: 精神行为症状
    - functional_impairment: 日常功能受损情况
    - risk_signals: 高风险信号或红旗征象
    - missing_info: 仍缺失、需补充的信息
    请严格按上述字段逐项输出，不要输出无关段落。
    必须输出单个 JSON object，禁止 markdown 代码块，禁止列表前缀符号（如 -、*、1.）。
  expected_output: >-
    结构化字段结果，包含：
    core_symptoms, onset_time, progression_speed, cognitive_domains,
    behavioral_psychological, functional_impairment, risk_signals, missing_info
  agent: data_extraction_agent
  async_execution: false

primary_care_task:
  description: >-
    请基于 `extraction_task` 的结构化输出，为患者提供全科（Primary Care）视角的初步诊断。
    请先使用已挂载的 RAG Tool 检索相关指南条目（top 5），严格基于检索条目与上游结构化结果作答，不得引用未检索内容。
    注意：原先的“可逆病因优先”规则已收紧——不得仅因为未完成 TSH/B12/MRI 等检查就认定“更符合可逆因素解释”。
    全科任务的额外职责：优先识别并强调明确的躯体可逆病因线索（例如乏力/怕冷/便秘等甲减样症状；明确营养缺乏或 B12 缺乏证据；长期使用已知影响认知的药物）。仅当病史或 `extraction_task` 明确出现这些“躯体可逆因素”线索，且不存在 AD 红旗信号时，方可按可逆病因优先将 `risk_level` 设为 `low`。
    若患者存在明显抑郁、睡眠障碍、食欲下降、重大心理应激、社交退缩等情绪/睡眠因素，并伴随持续认知主诉或家属观察到的认知下降，应输出 `medium`，而不是 `low`；这类情况可考虑抑郁相关认知下降或假性痴呆，虽可能可逆，但需要精神心理评估、干预和随访，不能归入正常老化/低风险。
    正常老化 / 轻微主观认知下降规则：若仅表现为偶发轻微健忘、偶发找词困难、主观记忆变慢，且日常生活功能完全保留、能使用补偿策略（如日历、提醒工具）、无明确持续加重、无客观量表异常、无定向障碍/迷路、无行为精神症状、无神经系统体征，则应输出 `low`。
    不得仅因为“记忆 + 找词困难”就认定为多个认知域明确受损；只有当这些问题表现为持续、反复、逐渐加重，或有 MoCA/MMSE 等客观证据支持，才可认为超出正常老化范围并考虑 `medium`。
    分离判断与检查建议：在 `additional_tests`/`recommended_tests` 中可建议完成 TSH、B12、MRI 等排查，但“需要排查”本身不应成为将 `risk_level` 降为 `low` 或升为 `medium` 的充分理由。
    输出中必须包含 `evidence_chunks` 字段，列出引用到的 chunk 文件名（如 chunk_012.txt）。
    输出字段要求（必须且仅包含）：
    - reversible_causes
    - additional_tests
    - referral_suggestions
    - risk_level
    - evidence_chunks
    若某字段在检索结果中没有证据，请输出空列表 [] 或 "unknown"。
    必须输出单个 JSON object，禁止 markdown 代码块，禁止列表前缀符号（如 -、*、1.）。
  expected_output: >-
    结构化字段结果，包含：reversible_causes, additional_tests,
    referral_suggestions, risk_level, evidence_chunks。
    规则要点：
    - 仅当 `extraction_task` 或病史明确存在“躯体可逆因素”线索（见 description 中示例）且无红旗信号时，方可将 `risk_level` 设为 `low`；
    - 若存在明显抑郁、睡眠障碍、食欲下降、重大心理应激、社交退缩等情绪/睡眠因素，并伴随持续认知主诉或家属观察到的认知下降，则应判 `medium`，而不是 `low`；
    - 这类情绪/睡眠相关认知下降虽可能可逆，但需要精神心理评估、干预和随访，不能归入正常老化/低风险；
    - 若仅有偶发轻微健忘、偶发找词困难或主观记忆变慢，且功能完全保留、无客观异常和无持续加重证据，则应优先判 `low`，而不是 `medium`；
    - 若存在持续 1 年以上记忆下降、家属明确观察且 MoCA/MMSE 存在边界/轻度异常，则应优先考虑 `medium`（即 MCI/前驱期），即使仍建议完成可逆因素筛查；
    - 在 `additional_tests` 中建议 TSH、B12、叶酸、MRI 等，但“需要排查”不等于“已存在可逆因素解释”。
  agent: primary_care_agent
  async_execution: true
  context:
    - extraction_task

